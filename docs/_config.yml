title: "GEN220: High Throughput Biological Data Analysis"
description: "UC Riverside GEN220 - Fall 2026. UNIX, Python, and bioinformatics for high throughput biological data."

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: light

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-default-layout

# pages without front matter get their title from the first heading
titles_from_headings:
  enabled: true
  strip_title: false
  collections: false

relative_links:
  enabled: true
  collections: false

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Course repo on GitHub":
    - "https://github.com/biodataprog/GEN220_2026"
  "Class examples":
    - "https://github.com/biodataprog/GEN220_2026_classexamples"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/biodataprog/GEN220_2026"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

footer_content: "GEN220 Fall 2026 &middot; UC Riverside &middot; Jason Stajich"

exclude:
  - Makefile
  - "*/Makefile"
  - metadata.yaml
  - "*/metadata.yaml"

# Sidebar navigation. Lecture files have no front matter (so pandoc PDFs
# stay clean); their section (parent) and ordering are assigned here instead.
# New lecture? Add a line for it below or it will not appear in the sidebar.
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "Assignments/hide" }
    values: { nav_exclude: true, search_exclude: true }
  - scope: { path: "01_Intro_Command_Line.md" }
    values: { nav_exclude: true }

  # Section landing pages (top level of the sidebar)
  - { scope: { path: "index.md" }, values: { title: Home, nav_order: 1 } }
  - { scope: { path: "UNIX/index.md" }, values: { title: UNIX, has_children: true, nav_order: 2 } }
  - { scope: { path: "Python/index.md" }, values: { title: Python, has_children: true, nav_order: 3 } }
  - { scope: { path: "Bioinformatics/index.md" }, values: { title: Bioinformatics, has_children: true, nav_order: 4 } }
  - { scope: { path: "Misc/index.md" }, values: { title: Other Skills and Tools, has_children: true, nav_order: 5 } }
  - { scope: { path: "Assignments/index.md" }, values: { title: Assignments, has_children: true, nav_order: 6 } }
  - { scope: { path: "Resources/index.md" }, values: { title: Resources, has_children: true, nav_order: 7 } }

